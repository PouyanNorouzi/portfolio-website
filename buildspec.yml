version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      # Keep in step with packageManager in package.json.
      - npm install -g pnpm@11.10.0
  build:
    commands:
      - pnpm install --frozen-lockfile
      - pnpm rebuild
      - pnpm run generate

artifacts:
  files:
    - .output/public/**/*

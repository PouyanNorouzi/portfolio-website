<!doctype html>
<!--
  Template for public/og-image.png, the 1200x630 link preview image.

  It borrows the fonts from the built site, so regenerate it from a fresh build:
    ./node_modules/.bin/nuxt generate
    cp scripts/og-image.html .output/public/
    (cd .output/public && python3 -m http.server 4818 &)
    chromium --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=5000 --screenshot=public/og-image.png \
      http://localhost:4818/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Load the built entry stylesheet so the @nuxt/fonts @font-face rules apply.
      fetch("/")
        .then((response) => response.text())
        .then((html) => {
          const href = html.match(/\/_nuxt\/entry\.[^"]+\.css/)?.[0];
          if (!href) return;
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.append(link);
        });
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0f172b;
        color: #f8fafc;
        font-family: Monda, sans-serif;
      }
      .card {
        position: absolute;
        inset: 36px;
        border: 1px solid #314158;
        border-radius: 12px;
        background: #020618;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .hazard {
        padding: 8px 0;
        background: repeating-linear-gradient(45deg, #ff6467 0 18px, #0a0a0a 18px 36px);
      }
      .hazard div {
        background: #0a0a0a;
        padding: 16px 0;
        text-align: center;
        font-family: Tourney, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.3em;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        padding: 18px 40px 0;
      }
      .label {
        font-family: "Share Tech Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #90a1b9;
      }
      .rule {
        margin: 14px 40px 0;
        border-top: 6px double #314158;
      }
      .body {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 0 56px;
      }
      .photo {
        width: 216px;
        height: 216px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 3px solid #05df72;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(1) contrast(1.1);
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        font-family: Tourney, sans-serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #05df72;
      }
      .role {
        font-size: 28px;
        color: #cad5e2;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #05df72;
      }
      .status::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #05df72;
      }
      .stamp {
        position: absolute;
        right: 64px;
        bottom: 56px;
        padding: 8px 18px;
        border: 5px solid #ff6467;
        border-radius: 4px;
        color: #ff6467;
        font-family: "Share Tech Mono", monospace;
        font-size: 30px;
        letter-spacing: 0.2em;
        transform: rotate(-8deg);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hazard"><div>CLASSIFIED // EYES ONLY</div></div>
      <div class="meta">
        <span class="label">Case file no. PN-0013</span>
        <span class="label">pouyannorouzi.com</span>
      </div>
      <div class="rule"></div>
      <div class="body">
        <div class="photo"><img src="/me/1.webp" alt="" /></div>
        <div class="text">
          <h1>Pouyan Norouzi</h1>
          <p class="role">Software developer · BCIT Computer Systems</p>
          <span class="label status">Status: open to work</span>
        </div>
      </div>
      <div class="stamp">APPROVED</div>
    </div>
  </body>
</html>
